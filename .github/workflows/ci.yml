name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Runs every 3 days at midnight UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if on schedule without upstream changes'
        required: false
        type: boolean
        default: true

jobs:
  check-and-build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - craft-anything-bin
          - craft-anything-src
    steps:
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift 2>/dev/null || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix with Flakes
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Check trigger condition
        id: check-run
        run: |
          SHOULD_RUN=true

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Cron schedule triggered: checking for upstream release updates..."
            CURRENT_VER=$(grep -E 'version = "[^"]+"' pkgs/common.nix | head -n1 | sed -E 's/.*version = "([^"]+)".*/\1/')
            LATEST_TAG=$(curl -sSL "https://api.github.com/repos/storytold/craft-anything/releases/latest" | jq -r .tag_name)
            LATEST_VER="${LATEST_TAG#v}"
            echo "Current repo version: $CURRENT_VER | Upstream latest: $LATEST_VER"

            if [ -n "$LATEST_VER" ] && [ "$LATEST_VER" != "null" ] && [ "$LATEST_VER" != "$CURRENT_VER" ]; then
              echo "==> Upstream update available ($CURRENT_VER -> $LATEST_VER). Running checks."
              SHOULD_RUN=true
            else
              echo "==> Package is already at upstream latest ($CURRENT_VER). Skipping scheduled build."
              SHOULD_RUN=false
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.force_build }}" = "false" ]; then
              SHOULD_RUN=false
            fi
          else
            # On push and pull_request: always run to ensure commits don't break the build
            echo "==> Event '${{ github.event_name }}' detected: running full parallel validation."
            SHOULD_RUN=true
          fi

          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

      - name: Verify Flake evaluation and checks
        if: steps.check-run.outputs.should_run == 'true'
        run: |
          nix flake show
          nix flake check

      - name: Build Package (${{ matrix.package }})
        if: steps.check-run.outputs.should_run == 'true'
        run: |
          echo "==> Building ${{ matrix.package }}..."
          nix build .#${{ matrix.package }} --print-build-logs

      - name: Verify Binary Integrity and Dynamic Libraries
        if: steps.check-run.outputs.should_run == 'true'
        run: |
          echo "==> Verifying binary presence:"
          test -x ./result/bin/craft-anything
          test -x ./result/bin/craft-anything-cli

          echo "==> Verifying CLI doctor output:"
          ./result/bin/craft-anything-cli doctor || true

          echo "==> Verifying ELF dynamic library linkage (zero missing libraries):"
          ldd ./result/bin/.craft-anything-wrapped
          ! ldd ./result/bin/.craft-anything-wrapped | grep -i "not found"
          ldd ./result/bin/.craft-anything-cli-wrapped
          ! ldd ./result/bin/.craft-anything-cli-wrapped | grep -i "not found"

      - name: Report Status When Skipped
        if: steps.check-run.outputs.should_run != 'true'
        run: |
          echo "==> Scheduled check skipped because package is already at upstream latest."
