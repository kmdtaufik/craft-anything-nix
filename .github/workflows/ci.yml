name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Every 3 days at 00:00 UTC: pin the newest upstream release, then build it.
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    inputs:
      release:
        description: 'Upstream release to pin (empty = newest on GitHub)'
        required: false
        type: string
        default: ''
      force:
        description: 'Recompute the pins even when the version is unchanged'
        required: false
        type: boolean
        default: false

permissions:
  # The update job commits versions.json back to main.
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Update versions.json
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      version: ${{ steps.bump.outputs.version }}
      commit: ${{ steps.bump.outputs.commit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install Nix with Flakes
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Pin the release in versions.json
        id: bump
        env:
          RELEASE: ${{ inputs.release }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          before="$(jq -r .version versions.json)"
          echo "==> versions.json currently pins v${before}"

          if [ -n "${RELEASE}" ] && [ "${FORCE}" = "true" ]; then
            ./scripts/update.sh "${RELEASE}" --force
          elif [ -n "${RELEASE}" ]; then
            ./scripts/update.sh "${RELEASE}"
          elif [ "${FORCE}" = "true" ]; then
            ./scripts/update.sh --force
          else
            ./scripts/update.sh
          fi

          after="$(jq -r .version versions.json)"
          echo "version=${after}" >>"$GITHUB_OUTPUT"

          if git diff --quiet -- versions.json; then
            echo "==> versions.json already pins v${after}; nothing to commit."
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "chore: pin craft-anything v${after} (was v${before})"
          git push origin HEAD:main

          echo "==> committed v${after}"
          echo "changed=true" >>"$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package }}
    needs: [ update ]
    # A push or pull request always builds both strategies, whatever the version.
    # A scheduled run builds only when the update job pinned something new.
    if: |
      always() && (
        github.event_name == 'push' ||
        github.event_name == 'pull_request' ||
        github.event_name == 'workflow_dispatch' ||
        needs.update.outputs.changed == 'true'
      )
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - craft-anything-bin
          - craft-anything-src
    steps:
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift 2>/dev/null || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A scheduled build must see the commit the update job just pushed.
          ref: ${{ needs.update.outputs.commit || github.sha }}

      - name: Install Nix with Flakes
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Verify Flake evaluation and checks
        run: |
          nix flake show
          nix flake check

      - name: Build Package (${{ matrix.package }})
        run: |
          echo "==> Building ${{ matrix.package }} from versions.json $(jq -r .version versions.json)"
          nix build .#${{ matrix.package }} --print-build-logs

      - name: Verify Binary Integrity and Dynamic Libraries
        run: |
          echo "==> Verifying binary presence:"
          test -x ./result/bin/craft-anything
          test -x ./result/bin/craft-anything-cli

          echo "==> Verifying CLI doctor output:"
          ./result/bin/craft-anything-cli doctor || true

          echo "==> Verifying ELF dynamic library linkage (zero missing libraries):"
          ldd ./result/bin/.craft-anything-wrapped
          ! ldd ./result/bin/.craft-anything-wrapped | grep -i "not found"
          ldd ./result/bin/.craft-anything-cli-wrapped
          ! ldd ./result/bin/.craft-anything-cli-wrapped | grep -i "not found"
